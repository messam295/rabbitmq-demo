<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">

<title>RabbitMQ Interactive Tutorial — .NET Edition</title>
<style>
/* ── Reset & Root ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f1117;
  --surface:  #1a1f2e;
  --elevated: #252b3b;
  --border:   #2d3748;
  --cyan:     #00d4ff;
  --cyan-dim: #007a94;
  --amber:    #f59e0b;
  --green:    #22c55e;
  --red:      #ef4444;
  --text:     #e2e8f0;
  --muted:    #94a3b8;
  --faint:    #4a5568;
  --sidebar:  252px;
  --r:        8px;
  --mono:     'Cascadia Code','Fira Code','Consolas','Menlo',monospace;
  --sans:     -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:      #f1f5f9;
    --surface: #ffffff;
    --elevated:#f8fafc;
    --border:  #e2e8f0;
    --text:    #1e293b;
    --muted:   #64748b;
    --faint:   #cbd5e1;
  }
}

html { font-size: 15px; scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* ── Sidebar ────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar);
  min-width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  z-index: 20;
}

.sb-logo {
  padding: 20px 16px 18px;
  border-bottom: 1px solid var(--border);
}

.sb-logo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}

.sb-logo svg { flex-shrink: 0; }

.sb-title { font-size: 1rem; font-weight: 700; color: var(--cyan); letter-spacing: -0.02em; }
.sb-sub   { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

.sb-nav { flex: 1; padding: 10px 0; list-style: none; }

.nav-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 16px;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.81rem;
  border-left: 3px solid transparent;
  transition: all 0.15s ease;
  line-height: 1.35;
  user-select: none;
}
.nav-item:hover   { color: var(--text); background: rgba(0,212,255,0.04); }
.nav-item.active  { color: var(--cyan); border-left-color: var(--cyan); background: rgba(0,212,255,0.08); font-weight: 600; }

.nav-num { font-size: 0.68rem; font-family: var(--mono); color: var(--faint); min-width: 14px; padding-top: 1px; }
.nav-item.active .nav-num { color: var(--cyan-dim); }

.sb-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.glos-btn {
  width: 100%;
  padding: 9px 12px;
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.25);
  border-radius: var(--r);
  color: var(--cyan);
  font-size: 0.81rem;
  font-family: var(--sans);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s;
}
.glos-btn:hover { background: rgba(0,212,255,0.15); }

/* ── Main ───────────────────────────────────────────────── */
#main {
  flex: 1;
  min-width: 0;
  padding: 32px 36px 60px;
  overflow-x: hidden;
}

.ch-header { margin-bottom: 22px; position: relative; }
.ch-label  { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cyan); font-weight: 600; margin-bottom: 6px; }
.ch-title  { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
.ch-sub    { font-size: 0.88rem; color: var(--muted); margin-top: 6px; }

/* ── Diagram area ───────────────────────────────────────── */
#diagram-area {
  background: var(--elevated);
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 18px;
}

#diagram-area svg { display: block; width: 100%; }

.sub-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.sub-tab {
  padding: 9px 18px;
  font-size: 0.81rem;
  font-weight: 500;
  cursor: pointer;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  border-radius: 6px 6px 0 0;
  transition: background 0.12s, color 0.12s;
  user-select: none;
}
.sub-tab:hover        { color: var(--text); background: var(--border); }
.sub-tab.active       { color: var(--cyan); border-bottom-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 8%, transparent); font-weight: 600; }
.sub-tab.active:hover { background: color-mix(in srgb, var(--cyan) 8%, transparent); color: var(--cyan); }

#code-tab-bar button { padding:8px 16px;font-size:12px;font-weight:500;border:none;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;background:none;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:background 0.12s,color 0.12s; }
#code-tab-bar button:hover        { background:var(--border); color:var(--text); }
#code-tab-bar button.active       { color:var(--accent); border-bottom-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%,transparent); font-weight:600; }
#code-tab-bar button.active:hover { background:color-mix(in srgb,var(--accent) 8%,transparent); color:var(--accent); }

/* ── Controls ───────────────────────────────────────────── */
#controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
  align-items: center;
  min-height: 40px;
}

.btn {
  padding: 8px 16px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--elevated);
  color: var(--text);
  font-size: 0.81rem;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
  white-space: nowrap;
}
.btn:hover     { border-color: var(--cyan); color: var(--cyan); }
.btn:disabled  { opacity: 0.38; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.btn-primary { background: rgba(0,212,255,0.12); border-color: rgba(0,212,255,0.4); color: var(--cyan); }
.btn-primary:hover { background: rgba(0,212,255,0.22); }
.btn-green   { background: rgba(34,197,94,0.1);  border-color: rgba(34,197,94,0.35);  color: var(--green); }
.btn-green:hover { background: rgba(34,197,94,0.2); }
.btn-amber   { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.35); color: var(--amber); }
.btn-amber:hover { background: rgba(245,158,11,0.2); }
.btn-danger  { background: rgba(239,68,68,0.1);  border-color: rgba(239,68,68,0.35);  color: var(--red); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }

.tog-group { display: flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.tog-group .btn { border: none; border-right: 1px solid var(--border); border-radius: 0; }
.tog-group .btn:last-child { border-right: none; }
.tog-group .btn.active { background: rgba(0,212,255,0.15); color: var(--cyan); }

.ctrl-label { font-size: 0.77rem; color: var(--muted); }

.rk-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rk-input {
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-size: 0.84rem;
  font-family: var(--mono);
  min-width: 240px;
  outline: none;
  transition: border-color 0.15s;
}
.rk-input:focus { border-color: var(--cyan); }

#match-out { font-size: 0.77rem; font-family: var(--mono); }
#match-out .hit  { color: var(--green); }
#match-out .miss { color: var(--red); }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 0.71rem;
  font-weight: 600;
}
.badge-cyan  { background: rgba(0,212,255,0.12); color: var(--cyan); }
.badge-green { background: rgba(34,197,94,0.12); color: var(--green); }
.badge-red   { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-amber { background: rgba(245,158,11,0.12); color: var(--amber); }

/* ── Code panel ─────────────────────────────────────────── */
#code-wrap {
  background: #0d1117;
  border-radius: 10px;
  border: 1px solid #30363d;
  overflow: hidden;
}
.code-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  border-bottom: 1px solid #30363d;
  background: #161b22;
}
.code-lang { font-size: 0.69rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; font-family: var(--mono); }
.code-dots { display: flex; gap: 5px; }
.code-dot  { width: 10px; height: 10px; border-radius: 50%; }
pre.code-blk {
  padding: 18px 20px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 0.79rem;
  line-height: 1.75;
  color: #c9d1d9;
  background: transparent;
}
pre.code-blk code { font-family: inherit; }

.tok-cmt  { color: #8b949e; font-style: italic; }
.tok-str  { color: #a5d6ff; }
.tok-kw   { color: #ff7b72; }
.tok-type { color: #79c0ff; }
.tok-num  { color: #f2cc60; }

.code-hl {
  display: block;
  background: rgba(0,212,255,0.07);
  border-left: 2px solid var(--cyan);
  margin-left: -20px;
  padding-left: 18px;
  margin-right: -20px;
  padding-right: 20px;
}

/* ── Glossary ───────────────────────────────────────────── */
#g-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 80;
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s ease;
}
#g-overlay.open { opacity: 1; pointer-events: all; }

#g-panel {
  position: fixed; top: 0; right: 0;
  width: 380px; height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 90;
  transform: translateX(100%);
  transition: transform 0.28s ease;
  display: flex; flex-direction: column;
}
#g-panel.open { transform: translateX(0); }

.g-hd {
  padding: 18px 20px 15px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.g-hd-title { font-size: 1rem; font-weight: 700; color: var(--cyan); }
.g-close {
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  font-size: 1.1rem; padding: 3px 7px;
  border-radius: 4px; line-height: 1;
}
.g-close:hover { color: var(--text); background: var(--elevated); }

.g-list { flex: 1; overflow-y: auto; padding: 12px 16px; }
.g-item {
  margin-bottom: 10px;
  padding: 11px 13px;
  background: var(--elevated);
  border-radius: var(--r);
  border: 1px solid var(--border);
  transition: border-color 0.15s;
}
.g-item:hover { border-color: rgba(0,212,255,0.35); }
.g-term { font-weight: 600; font-size: 0.83rem; color: var(--cyan); margin-bottom: 3px; }
.g-def  { font-size: 0.78rem; color: var(--muted); line-height: 1.55; }

/* ── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Reduced motion ─────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── Mobile top bar ─────────────────────────────────────── */
#mobile-bar {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 50;
  align-items: center;
  padding: 0 14px;
  gap: 12px;
}
#mob-ham {
  background: none; border: none;
  color: var(--text); cursor: pointer;
  padding: 6px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 5px;
}
#mob-ham span {
  display: block; width: 22px; height: 2px;
  background: currentColor; border-radius: 2px;
}
.mob-bar-title { font-size: 0.88rem; font-weight: 700; color: var(--cyan); }

#sb-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 40;
}
#sb-overlay.open { display: block; }

/* ── Mobile layout ──────────────────────────────────────── */
@media (max-width: 767px) {
  #mobile-bar { display: flex; }
  body { padding-top: 52px; }

  #sidebar {
    position: fixed;
    top: 52px; left: 0;
    height: calc(100vh - 52px);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 45;
  }
  #sidebar.open { transform: translateX(0); }

  #main { padding: 20px 16px 40px; }
  .ch-title { font-size: 1.25rem; }
  .ch-sub   { font-size: 0.82rem; }

  #diagram-area { overflow-x: auto; }
  #diagram-area svg { width: auto !important; min-width: 580px; }

  pre.code-blk { font-size: 0.72rem; padding: 14px 14px; }
  .code-hl { margin-left: -14px; padding-left: 12px; margin-right: -14px; padding-right: 14px; }

  #g-panel { width: 100%; }

  .rk-input { min-width: 160px; }

  #code-tab-bar { overflow-x: auto; flex-wrap: nowrap; }
  #code-tab-bar button { white-space: nowrap; }
}
</style>
</head>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */
const CHAPTERS = [
  { id: 0, label: 'Intro',     title: 'What is RabbitMQ?',     sub: 'Message brokers and why you need one' },
  { id: 1, label: 'Ch 1',     title: 'The Broker',             sub: 'Connections, channels, exchanges, queues & bindings' },
  { id: 2, label: 'Ch 2',     title: 'The Basics',             sub: 'Producer → Queue → Consumer with ACK/NACK' },
  { id: 3, label: 'Ch 3',     title: 'Exchanges',              sub: 'Direct, Topic, and Fanout routing' },
  { id: 4, label: 'Ch 4',     title: 'Routing Keys',           sub: 'Pattern matching with * and # wildcards' },
  { id: 5, label: 'Ch 5',     title: 'Multiple Consumers',     sub: 'Competing consumers with prefetch / QoS' },
  { id: 6, label: 'Ch 6',     title: 'Failure Handling',       sub: 'NACK, requeue, and consumer_timeout' },
  { id: 7, label: 'Ch 7',     title: 'Dead Letter Queue',      sub: 'DLX and DLQ — where failed messages go' },
  { id: 8, label: 'Ch 8',     title: "What's Next",            sub: 'Publisher Confirms, TTL, Queue Limits & Streams' },
];

const GLOSSARY = [
  { term: 'Message Broker',         def: 'Middleware that receives messages from producers and routes them to consumers. Decouples senders from receivers so neither needs to know about the other.' },
  { term: 'Asynchronous Messaging', def: 'A communication pattern where the sender fires a message and continues without waiting for the receiver to process it. Improves throughput and resilience.' },
  { term: 'Decoupling',             def: 'Separating components so they do not directly depend on each other. A broker lets services evolve, scale, and fail independently.' },
  { term: 'Producer',               def: 'An application (or thread) that creates and publishes messages to a RabbitMQ exchange.' },
  { term: 'Consumer',               def: 'An application that subscribes to a queue and processes the messages it receives, then sends an ACK or NACK.' },
  { term: 'Queue',                  def: 'A FIFO buffer that stores messages until a consumer retrieves them. Declare it durable + send persistent messages to survive broker restarts.' },
  { term: 'Exchange',               def: 'Receives messages from producers and routes them to queues based on its type (direct / topic / fanout) and bindings.' },
  { term: 'Binding',                def: 'A link between an exchange and a queue, optionally with a routing-key pattern. Tells the exchange which messages to forward to which queue.' },
  { term: 'Routing Key',            def: 'A dot-separated string attached to a message (e.g. "orders.europe.high"). The exchange uses it to decide which queues receive the message.' },
  { term: 'Channel',                def: 'A lightweight virtual connection multiplexed inside a TCP Connection. Create one channel per thread or Task — they are cheap and not thread-safe.' },
  { term: 'Connection',             def: 'A long-lived TCP connection to RabbitMQ. Expensive to open — share one per process. Channels are opened inside connections.' },
  { term: 'ACK',                    def: 'Acknowledgement. Sent by the consumer after successfully processing a message. Tells RabbitMQ it is safe to permanently delete that message.' },
  { term: 'NACK',                   def: 'Negative Acknowledgement. Tells RabbitMQ processing failed. You choose whether to requeue the message for retry or discard it (→ DLQ).' },
  { term: 'Prefetch Count (QoS)',   def: 'Limits how many unACKed messages a consumer holds at once. Set to 1 for fair dispatch — prevents a fast consumer from hoarding messages while a slow one starves.' },
  { term: 'Durable',                def: 'A queue or exchange that survives a broker restart. Must be combined with persistent message delivery for full durability.' },
  { term: 'Persistent',             def: 'Message delivery mode = 2. Tells RabbitMQ to write the message to disk. Combine with a durable queue to guarantee survival across restarts.' },
  { term: 'Dead Letter Exchange (DLX)', def: 'An exchange where rejected (NACK + requeue:false) or expired messages are re-published. Configured on a queue via the x-dead-letter-exchange argument.' },
  { term: 'consumer_timeout',       def: 'A broker-side timeout. If a consumer holds an unACKed message longer than this limit (default: 30 min), the channel is force-closed and the message requeued.' },
  { term: 'Redelivered',            def: 'A flag on an incoming message. true means RabbitMQ already delivered this message at least once before. Always handle messages idempotently.' },
  { term: 'Idempotency',            def: 'Designing an operation so it produces the same result whether applied once or many times. Required because RabbitMQ guarantees at-least-once delivery — a message may arrive twice if the consumer crashes before ACKing.' },
  { term: 'At-Least-Once Delivery', def: 'RabbitMQ\'s delivery guarantee with manual ACK: every message is delivered at least once, but may be redelivered after a consumer crash. Exactly-once is not guaranteed — write idempotent consumers.' },
  { term: 'exclusive',              def: 'Queue option: the queue is tied to the connection that declared it and is deleted when that connection closes. Used for temporary per-consumer queues (e.g. RPC reply queues).' },
  { term: 'autoDelete',             def: 'Queue option: the queue is automatically deleted when the last consumer unsubscribes. Useful for short-lived work queues that should not outlive their consumers.' },
  { term: 'autoAck',                def: 'BasicConsumeAsync option: if true, the broker deletes the message the moment it is delivered, without waiting for an explicit ACK. Fast but unsafe — a crash between delivery and processing loses the message permanently.' },
  { term: 'DeliveryTag',            def: 'A monotonically increasing integer assigned by the broker to each delivery on a channel. Passed back in BasicAckAsync / BasicNackAsync to tell the broker which message is being acknowledged.' },
  { term: 'mandatory',              def: 'BasicPublishAsync flag: if true, the broker returns the message to the producer when no queue matches the routing key, instead of silently dropping it. Useful for detecting misconfigured bindings.' },
  { term: 'Message TTL',            def: 'Time-to-live for a message. Set per-message or per-queue. When a message expires before being consumed, it is dead-lettered (if a DLX is configured) or discarded.' },
];

const NS = 'http://www.w3.org/2000/svg';
function s(tag, a={}) {

function svgEl(tag, attrs={}) {

}

function makeSVG(W, H) {
  const svg = svgEl('svg', { viewBox:`0 0 ${W} ${H}`, width:'100%', height:H,
    xmlns: NS, style:'display:block;overflow:visible' });
  const defs = svgEl('defs');

  const mkM = (id, col) => {
    const m = svgEl('marker', { id, markerWidth:'8', markerHeight:'6',
      refX:'7', refY:'3', orient:'auto' });
    const p = svgEl('polygon', { points:'0 0,8 3,0 6', fill:col });
    m.appendChild(p); return m;
  };
  defs.appendChild(mkM('am-cyan',  '#00d4ff'));
  defs.appendChild(mkM('am-muted', '#4a5568'));
  defs.appendChild(mkM('am-red',   '#ef4444'));
  defs.appendChild(mkM('am-green', '#22c55e'));
  defs.appendChild(mkM('am-amber', '#f59e0b'));

  const flt = svgEl('filter', { id:'glow', x:'-60%', y:'-60%', width:'220%', height:'220%' });
  const fb  = svgEl('feGaussianBlur', { stdDeviation:'3.5', result:'blur' });
  const fm  = svgEl('feMerge');
  fm.appendChild(svgEl('feMergeNode', { in:'blur' }));
  fm.appendChild(svgEl('feMergeNode', { in:'SourceGraphic' }));
  flt.appendChild(fb); flt.appendChild(fm);
  defs.appendChild(flt);
  svg.appendChild(defs);
  return svg;
}

const REDUCED = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function eio(t) { return t<0.5?2*t*t:-1+(4-2*t)*t; }
function lerp(a,b,t){ return a+(b-a)*t; }

function posOn(wps, t) {
  const n = wps.length-1;
  if(n===0) return {x:wps[0][0],y:wps[0][1]};
  const seg = Math.min(Math.floor(t*n),n-1);
  const st  = t*n - seg;
  return { x:lerp(wps[seg][0],wps[seg+1][0],st),
           y:lerp(wps[seg][1],wps[seg+1][1],st) };
}

/* ── Pause state ─────────────────────────────────────────── */
let PAUSED = false;

// Transforms a button into a ⏸ Pause / ▶ Resume toggle for the
// duration of an animation. Returns a restore() function to call when done.
function animCtrl(btn) {
  const origText  = btn.textContent;
  const origClick = btn.onclick;
  PAUSED = false;
  btn.textContent = '⏸ Pause';
  btn.disabled    = false;
  btn.onclick = () => {
    PAUSED = !PAUSED;
    btn.textContent = PAUSED ? '▶ Resume' : '⏸ Pause';
  };
  return function restore() {
    PAUSED = false;
    btn.textContent = origText;
    btn.onclick     = origClick;
    btn.disabled    = false;
  };
}

function dot(svg, wps, {col='#00d4ff',r=7,dur=900,onArrive,onDone}={}) {
  const c = svgEl('circle',{r,fill:col,filter:'url(#glow)'});
  svg.appendChild(c);
  if(REDUCED){
    const end=wps[wps.length-1];
    c.setAttribute('cx',end[0]); c.setAttribute('cy',end[1]);
    setTimeout(()=>{ onArrive&&onArrive(c); onDone&&onDone(c); },20);
    return c;
  }
  // Use elapsed-time tracking so pause simply stops accumulating time
  let elapsed=0, lastTs=null;
  function step(ts){
    if(!PAUSED){
      if(lastTs!==null) elapsed += ts-lastTs;
      lastTs=ts;
    } else {
      lastTs=null; // reset so we don't count paused time on resume
    }
    const raw=Math.min(elapsed/dur,1), t=eio(raw);
    const p=posOn(wps,t);
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y);
    if(raw<1){ requestAnimationFrame(step); }
    else { onArrive&&onArrive(c); setTimeout(()=>onDone&&onDone(c),20); }
  }
  requestAnimationFrame(step);
  return c;
}

function flash(svg,x,y,col='#22c55e') {
  if(REDUCED) return;
  const ring=svgEl('circle',{cx:x,cy:y,r:'10',fill:'none',stroke:col,'stroke-width':'2',opacity:'0.8'});
  svg.appendChild(ring);
  let elapsed=0, lastTs=null;
  function step(ts){
    if(!PAUSED){
      if(lastTs!==null) elapsed += ts-lastTs;
      lastTs=ts;
    } else {
      lastTs=null;
    }
    const p=elapsed/450;
    if(p>=1){ try{svg.removeChild(ring);}catch(_){} return; }
    ring.setAttribute('r', lerp(10,28,p));
    ring.setAttribute('opacity', lerp(0.8,0,p));
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function rm(el){ try{ el.parentNode.removeChild(el); }catch(_){} }

function wait(ms){
  if(REDUCED) return new Promise(r=>setTimeout(r,5));
  return new Promise(r=>{
    let elapsed=0, lastTs=null;
    function check(ts){
      if(!PAUSED){
        if(lastTs!==null) elapsed += ts-lastTs;
        lastTs=ts;
      } else {
        lastTs=null;
      }
      if(elapsed>=ms) r();
      else requestAnimationFrame(check);
    }
    requestAnimationFrame(check);
  });
}

   CODE HIGHLIGHTER — DOM-based (no innerHTML, CSP-safe)
═══════════════════════════════════════════════════════════ */
const KW = new Set(['await','using','var','async','new','if','else','return','void','string',
  'bool','int','true','false','null','static','public','private','protected','override',
  'sealed','class','interface','readonly','abstract']);
const TY = new Set(['ConnectionFactory','AsyncEventingBasicConsumer','Encoding','JsonSerializer',
  'Dictionary','ExchangeType','IHostedService','BackgroundService','IConnection',
  'IChannel','ILogger','Worker','Task','CancellationToken','Timeout']);

function tokenizeLine(line) {
  const toks = []; let pos = 0;
  while (pos < line.length) {
    // comment — rest of line
    if (line[pos]==='/' && line[pos+1]==='/') {
      toks.push({text: line.slice(pos), cls:'tok-cmt'}); break;
    }
    // string / interpolated string
    if (line[pos]==='"' || line[pos]==='`' || (line[pos]==='$' && line[pos+1]==='"')) {
      const start = pos;
      const q = line[pos]==='$' ? (pos++, '"') : line[pos];
      pos++;
      while (pos < line.length && line[pos] !== q) { if (line[pos]==='\\') pos++; pos++; }
      toks.push({text: line.slice(start, pos+1), cls:'tok-str'});
      pos++; continue;
    }
    // identifier → keyword or type
    if (/[a-zA-Z_$]/.test(line[pos])) {
      let end = pos+1;
      while (end < line.length && /[a-zA-Z0-9_$]/.test(line[end])) end++;
      const w = line.slice(pos, end);
      toks.push({text: w, cls: KW.has(w)?'tok-kw': TY.has(w)?'tok-type': null});
      pos = end; continue;
    }
    // number
    if (/\d/.test(line[pos])) {
      let end = pos+1;
      while (end < line.length && /[\d.]/.test(line[end])) end++;
      toks.push({text: line.slice(pos, end), cls:'tok-num'});
      pos = end; continue;
    }
    // plain chars — accumulate until next special
    let start = pos;
    while (pos < line.length &&
      !(line[pos]==='/' && line[pos+1]==='/') &&
      line[pos]!=='"' && line[pos]!=='`' &&
      !(line[pos]==='$' && line[pos+1]==='"') &&
      !/[a-zA-Z_$\d]/.test(line[pos])) pos++;
    if (pos > start) toks.push({text: line.slice(start, pos), cls: null});
    else { toks.push({text: line[pos], cls: null}); pos++; }
  }
  return toks;
}

function _fillCodeEl(code, hlLines) {
  const el = document.getElementById('code-inner');
  while (el.firstChild) el.removeChild(el.firstChild);
  const hlSet = new Set(hlLines || []);
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const wrap = document.createElement('span');
    if (hlSet.has(i+1)) wrap.className = 'code-hl';
    tokenizeLine(line).forEach(({text, cls}) => {
      if (cls) {
        const s = document.createElement('span');
        s.className = cls; s.textContent = text;
        wrap.appendChild(s);
      } else {
        wrap.appendChild(document.createTextNode(text));
      }
    });
    el.appendChild(wrap);
    if (i < lines.length-1) el.appendChild(document.createTextNode('\n'));
  });
}

function renderCodeDirect(code, hlLines) { _fillCodeEl(code, hlLines); }

function makeCodeTabs(tabs) {
  // tabs: [{label, code, hlLines}]
  const wrap = document.getElementById('code-wrap');
  const existing = document.getElementById('code-tab-bar');
  if (existing) existing.remove();
  const bar = document.createElement('div');
  bar.id = 'code-tab-bar';
  bar.style.cssText = 'display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface-2,#161b22);padding:0 12px;';
  let active = 0;
  function activate(i) {
    active = i;
    bar.querySelectorAll('button').forEach((b,j) => b.classList.toggle('active', j===i));
    renderCodeDirect(tabs[i].code, tabs[i].hlLines || []);
  }
  tabs.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.textContent = tab.label;
    btn.onclick = () => activate(i);
    bar.appendChild(btn);
  });
  wrap.insertBefore(bar, document.getElementById('code-body'));
  activate(0);
  return { activate, getActive: () => active, tabCount: tabs.length };
}

    'Exchange — receives published messages and decides which queues they go to, based on type (Direct / Topic / Fanout) and bindings.',
    'Binding — a routing rule that links an Exchange to a Queue. A topic binding can include wildcards (* / #) to match routing keys.',

  };

    'Use the controls below to see how the Consumer acknowledges (ACK) successful processing or requeues (NACK) a failed message. ' +
    'Important: RabbitMQ guarantees at-least-once delivery — if a consumer crashes before ACKing, the message is redelivered. ' +
    'This means your consumer logic must be idempotent: safe to run twice on the same message.';

  // ── Controls rendered ABOVE the diagram ──────────────────
  const ctrlRow = document.createElement('div');

<div class="tog-group">
  <button class="btn active" id="b1-ack">✓ ACK (success)</button>
  <button class="btn" id="b1-nack">↩ NACK (requeue)</button>
</div>`;
  da.appendChild(ctrlRow);

  // ── Description bar ───────────────────────────────────────
  const desc = document.createElement('div');
  desc.style.cssText = 'font-size:13px;color:var(--text-muted);min-height:20px;margin-bottom:12px;transition:color 0.2s;';

  // ── Diagram ───────────────────────────────────────────────

  box(svg,20,76,110,48,'Producer',null,{stroke:'#4a7aaa',fill:'#1a2035'});
  box(svg,200,76,110,48,'Exchange','(default "")',{stroke:'#7a5aaa',fill:'#20182a',tc:'#c0a8e8'});
  queue(svg,380,76,'"orders"');
  box(svg,560,76,120,48,'Consumer',null,{stroke:'#4aaa4a',fill:'#182018'});

  arrow(svg,130,100,198,100,{col:'muted'});
  arrow(svg,310,100,378,100,{col:'muted'});
  arrow(svg,496,100,558,100,{col:'muted'});
  txt(svg,380,185,'Messages are buffered in the queue until the consumer is ready',{col:'#4a5568',size:10});
  da.appendChild(svg);

  // ── Code tabs ─────────────────────────────────────────────
  const tabs = makeCodeTabs([
    { label: 'Producer',        code: CODE['1-producer'],      hlLines: [9,10,12,13] },
    { label: 'Consumer (ACK)',  code: CODE['1-consumer-ack'],  hlLines: [10,11] },
    { label: 'Consumer (NACK)', code: CODE['1-consumer-nack'], hlLines: [10,11,12] },
  ]);

  function setDesc(msg, col='var(--text-muted)'){
    desc.textContent = msg;
    desc.style.color = col;
  }

  function setOutcome(val) {
    outcome = val;
    const isAck = val === 'ack';
    document.getElementById('b1-ack').classList.toggle('active', isAck);
    document.getElementById('b1-nack').classList.toggle('active', !isAck);
    // Switch to the matching consumer tab
    tabs.activate(isAck ? 1 : 2);
  }

  async function send(){
    if(busy) return; busy=true;
    const restore1 = animCtrl(document.getElementById('b1-send'));

    // Step 1 — show Producer tab while dot travels to exchange
    tabs.activate(0);
    setDesc('📤 Producer serializes the order to JSON and publishes it to the exchange.');
    await new Promise(r=>dot(svg,[[75,100],[255,100]],{dur:900,onDone(d){rm(d);r();}}));
    await wait(400);

    // Step 2 — exchange to queue
    setDesc('🔀 Exchange routes the message to the "orders" queue using the routing key.');
    await new Promise(r=>dot(svg,[[255,100],[437,100]],{dur:900,onDone(d){rm(d);r();}}));
    await wait(500);

    // Step 3 — switch to consumer tab, then animate delivery
    tabs.activate(outcome === 'ack' ? 1 : 2);
    if(outcome==='ack'){
      setDesc('⚙️ Consumer receives the message and processes it…');
      await new Promise(r=>dot(svg,[[437,100],[620,100]],{dur:1000,
        onArrive(d){ flash(svg,620,100,'#22c55e'); setTimeout(()=>rm(d),180); },
        onDone:r}));
      await wait(300);
      setDesc('✅ Consumer sent ACK — RabbitMQ permanently removes the message from the queue.','#22c55e');
    } else {
      setDesc('⚙️ Consumer receives the message but cannot process it…');
      await new Promise(r=>dot(svg,[[437,100],[620,100]],{dur:1000,

          d.setAttribute('fill','#f59e0b');

          setTimeout(()=>{
            dot(svg,[[620,100],[437,100]],{col:'#f59e0b',dur:800,

          },500);
        }
      }));
      await wait(400);
      setDesc('⚠️ Message is requeued — another consumer (or the same one) will attempt it again.','#f59e0b');
    }
    await wait(1800);
    setDesc('Click "Send Message" to animate again. Toggle the outcome to see ACK vs NACK.');
    busy=false; restore1();
  }

  document.getElementById('b1-send').onclick=send;
  document.getElementById('b1-ack').onclick=()=>setOutcome('ack');
  document.getElementById('b1-nack').onclick=()=>setOutcome('nack');
}

      if(q2.pat) txt(svg,524,q2.y+8,q2.pat,{col:'#7a5aaa',size:9,mono:true,anchor:'end'});
    });

    da.appendChild(svg);
  }

  draw('direct');
  setTabUI('direct');

  function bindBtn(){
    const btn = document.getElementById('b2-anim');
    if(!btn) return;
    btn.onclick=()=>animate();
  }

  async function animate(){
    if(busy) return; busy=true;
    const btn=document.getElementById('b2-anim'); if(!btn){ busy=false; return; }
    const restore2=animCtrl(btn);
    const cfg=configs[tab];
    const svg=da.querySelector('svg');
    if(!svg){ busy=false; restore2(); return; }
    const H=parseInt(svg.getAttribute('height'));
    const exRX=430;

    if(tab==='fanout'){
      await new Promise(r=>dot(svg,[[120,H/2],[280,H/2]],{dur:450,onDone(d){rm(d);r();}}));
      const targets=cfg.animTargets.map(t=>[t.x,t.y]);
      let done=0;
      targets.forEach(([tx,ty])=>{
        dot(svg,[[430,H/2],[tx,ty]],{dur:520,
          onArrive(d){ flash(svg,tx,ty,'#00d4ff'); setTimeout(()=>rm(d),180); },
          onDone(){ done++; if(done===targets.length){ busy=false; restore2(); } }
        });
      });
    } else {
      const t=cfg.animTargets[0];
      await new Promise(r=>dot(svg,[[120,H/2],[280,H/2],[exRX,H/2],[t.x,t.y]],{dur:1100,
        onArrive(d){ flash(svg,t.x,t.y,'#00d4ff'); setTimeout(()=>rm(d),180); },
        onDone:r}));
      if(tab==='topic' && cfg.animTargets.length>1){
        const t2=cfg.animTargets[1];
        await wait(100);
        await new Promise(r=>dot(svg,[[exRX,H/2],[t2.x,t2.y]],{dur:480,
          onArrive(d){ flash(svg,t2.x,t2.y,'#00d4ff'); setTimeout(()=>rm(d),180); },
          onDone:r}));
      }
      busy=false; restore2();
    }
  }

  ca.innerHTML=`<button class="btn btn-primary" id="b2-anim">▶ Animate Routing</button>
<span class="ctrl-label">Click a tab to switch exchange types, then animate</span>`;
  bindBtn();
}

/* ═══════════════════════════════════════════════════════════
   CHAPTER 4 — Routing Keys
═══════════════════════════════════════════════════════════ */
function ch3(da, ca){
  document.getElementById('ch-brief').textContent =
    'A routing key is a plain dot-separated string attached to every published message — e.g. "orders.europe.high". ' +
    'Topic exchanges match it against binding patterns: * matches exactly one word segment, # matches zero or more. ' +
    'Segments are the parts between dots; matching is case-sensitive; hyphens and underscores are valid inside a segment. ' +
    'Type a routing key below to see which patterns match in real time.';

  da.innerHTML='';
  const svg = makeSVG(760,270); svg.setAttribute('height','270');

  const PATS = [
    { id:'p0', pat:'orders.*',        label:'"orders.any"',   qy:42,
      matches: k => { const p=k.split('.'); return p[0]==='orders' && p.length===2 && p[1].length>0; } },
    { id:'p1', pat:'orders.#',        label:'"orders.all"',   qy:100,
      matches: k => k==='orders' || k.startsWith('orders.') },
    { id:'p2', pat:'orders.europe.#', label:'"orders.europe"',qy:158,
      matches: k => k==='orders.europe' || k.startsWith('orders.europe.') },
    { id:'p3', pat:'orders.*.high',   label:'"orders.high-priority"',qy:216,
      matches: k => { const p=k.split('.'); return p.length===3 && p[0]==='orders' && p[2]==='high'; } },
  ];

  box(svg,20,120,100,44,'Producer',null,{stroke:'#4a7aaa',fill:'#1a2035'});
  box(svg,190,120,150,44,'Topic Exchange','type: topic',{stroke:'#00d4ff',fill:'#0f2030',tc:'#00d4ff'});
  arrow(svg,120,142,188,142,{col:'muted'});

  // store element references for later updating
  const arrowEls=[], patEls=[], qRects=[];
  PATS.forEach((p,i)=>{
    const qr = queue(svg,490,p.qy,p.label);
    const a = arrow(svg,340,142, 490,p.qy+24, {col:'muted'});
    a.setAttribute('id',`rk-arr-${p.id}`);
    const pe = txt(svg,480,p.qy+10,p.pat,{col:'#7a5aaa',size:10,mono:true,anchor:'end',id:`rk-pat-${p.id}`});
    arrowEls.push(a); patEls.push(pe); qRects.push(qr);
  });

  txt(svg,380,262,'Type a routing key below to see which queue patterns match',{col:'#4a5568',size:10});
  da.appendChild(svg);

  function update(key){
    PATS.forEach((p,i)=>{
      const hit = key.length>0 && p.matches(key);
      arrowEls[i].setAttribute('stroke',  hit?'#00d4ff':'#4a5568');
      arrowEls[i].setAttribute('opacity', hit?'1':'0.3');
      arrowEls[i].setAttribute('marker-end', hit?'url(#am-cyan)':'url(#am-muted)');
      patEls[i].setAttribute('fill', hit?'#00d4ff':'#7a5aaa');
      qRects[i].g.querySelector('rect:last-of-type').setAttribute('stroke', hit?'#00d4ff':'#4a5568');
    });
    const out = document.getElementById('match-out');
    if(!out) return;
    if(!key){ out.innerHTML='<span style="color:#64748b">Type a routing key to see matches</span>'; return; }
    const hits = PATS.filter(p=>p.matches(key)).map(p=>p.pat);
    if(hits.length===0) out.innerHTML=`<span class="miss">No patterns match "<strong>${key}</strong>"</span>`;
    else out.innerHTML=`<span class="hit">✓ Matches: ${hits.join('  ·  ')}</span>`;
  }

  ca.innerHTML=`
<p style="flex:0 0 100%;font-size:13px;color:var(--text-muted);margin:0 0 10px;">
  Try changing the routing key below to see which queue patterns match.
  Use <code style="font-size:11px;background:var(--surface-2,#161b22);padding:1px 5px;border-radius:3px;">orders.europe.high</code>,
  <code style="font-size:11px;background:var(--surface-2,#161b22);padding:1px 5px;border-radius:3px;">orders.us.low</code>,
  or any <code style="font-size:11px;background:var(--surface-2,#161b22);padding:1px 5px;border-radius:3px;">orders.&lt;region&gt;.&lt;priority&gt;</code> combination.
</p>
<div class="rk-wrap" style="flex:0 0 100%;">
  <span class="ctrl-label">Routing key:</span>
  <input class="rk-input" id="rk-in" placeholder="e.g. orders.europe.high" value="orders.europe.high" aria-label="Routing key to test"/>
  <span id="match-out" style="min-width:200px;"></span>
</div>`;
  const inp=document.getElementById('rk-in');
  inp.addEventListener('input',()=>update(inp.value.trim()));
  update(inp.value.trim());
}

/* ═══════════════════════════════════════════════════════════
   CHAPTER 5 — Multiple Consumers
═══════════════════════════════════════════════════════════ */
function ch4(da, ca){
  document.getElementById('ch-brief').textContent =
    'Competing consumers: multiple consumers share one queue — each message goes to exactly one of them, not all. ' +
    'This is different from fanout, where every consumer gets a copy. ' +
    'prefetchCount=1 ensures fair dispatch: a consumer only receives a new message after ACKing the previous one, ' +
    'preventing a slow consumer from blocking others. ' +
    'Note: with competing consumers, processing order is not guaranteed — Consumer 2 may finish before Consumer 1.';

  let busy=false;
  da.innerHTML='';
  const svg = makeSVG(760,240); svg.setAttribute('height','240');

  queue(svg,60,96,'"orders"');

  // Pending count label next to the queue
  const qPending = svgEl('text',{x:118,y:85,'text-anchor':'middle',
    fill:'#f59e0b','font-size':'10','font-family':'monospace',opacity:'0'});
  svg.appendChild(qPending);

  const CONS=[{x:510,y:40},{x:510,y:110},{x:510,y:180}];
  const badgeEls=[];

  CONS.forEach((c,i)=>{
    box(svg,c.x,c.y,140,46,`Consumer-${i+1}`,'prefetch: 1',{stroke:'#4aaa4a',fill:'#182018'});
    arrow(svg,176,120,c.x,c.y+23,{col:'muted'});
    const b=svgEl('text',{x:c.x+145,y:c.y+6,fill:'#00d4ff','font-size':'10','font-family':'monospace',opacity:'0.6'});
    b.textContent='idle'; svg.appendChild(b); badgeEls.push(b);
  });

  txt(svg,300,232,'prefetchCount=1 → consumer must ACK before RabbitMQ delivers the next message',{col:'#4a5568',size:10});
  da.appendChild(svg);

  function setBadge(ci, text, col, opacity=1){
    badgeEls[ci].textContent=text;
    badgeEls[ci].setAttribute('fill', col);
    badgeEls[ci].setAttribute('opacity', String(opacity));
  }
  function setPending(n){
    if(n>0){ qPending.textContent=`${n} waiting`; qPending.setAttribute('opacity','1'); }
    else   { qPending.setAttribute('opacity','0'); }
  }

  async function dispatch(ci){
    const c=CONS[ci];
    await new Promise(r=>dot(svg,[[176,120],[c.x,c.y+23]],{dur:1000,
      onArrive(d){ flash(svg,c.x,c.y+23,'#00d4ff'); setTimeout(()=>rm(d),180); },
      onDone:r}));
    setBadge(ci,'busy ●','#f59e0b');
  }

  async function ackConsumer(ci){
    const c=CONS[ci];
    flash(svg,c.x,c.y+23,'#22c55e');
    setBadge(ci,'✓ acked','#22c55e');
    await wait(700);
    setBadge(ci,'idle','#00d4ff',0.5);
  }

  async function runBatch(){
    if(busy) return; busy=true;
    const restore4=animCtrl(document.getElementById('b4-batch'));

    // Reset
    CONS.forEach((_,i)=>setBadge(i,'idle','#00d4ff',0.5));
    setPending(0);

    // Round 1 — dispatch 1 msg to each consumer in parallel
    // (RabbitMQ can give each consumer 1 msg since all slots are free)
    setPending(3); // 3 more waiting after these
    await Promise.all(CONS.map((_,i)=>dispatch(i)));
    // All 3 consumers now busy — prefetch=1 means queue holds remaining msgs
    await wait(1000);

    // Round 2 — each consumer ACKs, then immediately gets the next message.
    // Done sequentially so the viewer can follow each ACK → dispatch pair.
    for(let i=0;i<3;i++){
      await ackConsumer(i);
      setPending(2-i);
      await wait(300);
      await dispatch(i);      // slot opened → RabbitMQ delivers the held message
      await wait(500);
    }

    // Final ACKs
    await wait(700);
    for(let i=0;i<3;i++){
      await ackConsumer(i);
      await wait(250);
    }
    setPending(0);
    busy=false; restore4();
  }

  ca.innerHTML=`
<button class="btn btn-primary" id="b4-batch">▶ Send 6 Messages</button>
<span class="ctrl-label">Each consumer holds at most 1 unACKed message at a time</span>`;
  document.getElementById('b4-batch').onclick=runBatch;
}

/* ═══════════════════════════════════════════════════════════
   CHAPTER 6 — Failure Handling
═══════════════════════════════════════════════════════════ */
function ch5(da, ca){
  document.getElementById('ch-brief').textContent =
    'Messages fail for two reasons: transient (network blip, temporary unavailability — retry makes sense) ' +
    'and deterministic (malformed data, logic error — retrying forever is harmful). ' +
    'NACK + requeue:true is for transient failures only. ' +
    'For deterministic failures, NACK + requeue:false routes the message to the Dead Letter Exchange instead. ' +
    'Also: if a consumer disconnects while holding unACKed messages, RabbitMQ automatically requeues them for another consumer.';

  let busy=false;
  da.innerHTML='';
  const svg = makeSVG(760,220); svg.setAttribute('height','220');

  box(svg,10,86,100,46,'Producer',null,{stroke:'#4a7aaa',fill:'#1a2035'});
  queue(svg,170,86,'"orders"');
  box(svg,360,86,120,46,'Consumer',null,{stroke:'#4aaa4a',fill:'#182018'});
  box(svg,560,86,120,46,'DLQ','"orders.dlq"',{stroke:'#ef4444',fill:'#2a0d0d',tc:'#ef4444'});

  arrow(svg,110,109,168,109,{col:'muted'});
  arrow(svg,286,109,358,109,{col:'muted'});
  arrow(svg,482,109,558,109,{col:'red',dash:true});

  txt(svg,520,148,'— NACK+discard →',{col:'#ef4444',size:9,mono:true});
  txt(svg,227,80,'(messages buffered here)',{col:'#4a5568',size:9});

  const rdel=svgEl('text',{x:420,y:76,'text-anchor':'middle',fill:'#f59e0b','font-size':'10','font-family':'monospace',opacity:'0'});
  rdel.textContent='redelivered: true'; svg.appendChild(rdel);
  da.appendChild(svg);

  async function sendAndArrive(){
    await new Promise(r=>dot(svg,[[60,109],[224,109]],{dur:450,onDone(d){rm(d);r();}}));
    await wait(150);
    return new Promise(r=>dot(svg,[[224,109],[420,109]],{dur:550,onArrive(d){r(d);}}));
  }

  function allBtns(){ return ['b5-ok','b5-rq','b5-dl','b5-to'].map(id=>document.getElementById(id)).filter(Boolean); }
  function disableOthers(self){ allBtns().forEach(b=>{ if(b!==self) b.disabled=true; }); }
  function enableAll(){ allBtns().forEach(b=>{ b.disabled=false; }); }

  async function doOK(){
    if(busy)return; busy=true;
    const btn=document.getElementById('b5-ok');
    disableOthers(btn); const restore=animCtrl(btn);
    const d=await sendAndArrive();
    flash(svg,420,109,'#22c55e'); rm(d); await wait(300);
    busy=false; restore(); enableAll();
  }

  async function doNackRQ(){
    if(busy)return; busy=true;
    const btn=document.getElementById('b5-rq');
    disableOthers(btn); const restore=animCtrl(btn);
    const d=await sendAndArrive();
    d.setAttribute('fill','#f59e0b');
    await wait(300);
    rm(d);
    await new Promise(r=>dot(svg,[[420,109],[224,109]],{col:'#f59e0b',dur:500,
      onArrive(d2){
        flash(svg,224,109,'#f59e0b');
        rdel.setAttribute('opacity','1');
        setTimeout(()=>{ rm(d2); r(); },200);
      }}));
    await wait(1800); rdel.setAttribute('opacity','0');
    busy=false; restore(); enableAll();
  }

  async function doNackDL(){
    if(busy)return; busy=true;
    const btn=document.getElementById('b5-dl');
    disableOthers(btn); const restore=animCtrl(btn);
    const d=await sendAndArrive();
    d.setAttribute('fill','#ef4444');
    await wait(300); rm(d);
    await new Promise(r=>dot(svg,[[420,109],[620,109]],{col:'#ef4444',dur:520,
      onArrive(d2){ flash(svg,620,109,'#ef4444'); setTimeout(()=>{ rm(d2); r(); },200); }}));
    busy=false; restore(); enableAll();
  }

  async function doTimeout(){
    if(busy)return; busy=true;
    const btn=document.getElementById('b5-to');
    disableOthers(btn); const restore=animCtrl(btn);
    const d=await sendAndArrive();
    const timer=svgEl('text',{x:420,y:76,'text-anchor':'middle',fill:'#f59e0b','font-size':'10','font-family':'monospace'});
    timer.textContent='⏱ consumer_timeout…'; svg.appendChild(timer);
    await wait(1400); rm(timer); rm(d);
    await new Promise(r=>dot(svg,[[420,109],[620,109]],{col:'#ef4444',dur:520,
      onArrive(d2){ flash(svg,620,109,'#ef4444'); setTimeout(()=>{ rm(d2); r(); },200); }}));
    busy=false; restore(); enableAll();
  }

  ca.innerHTML=`
<button class="btn btn-green"  id="b5-ok">✓ Process OK (ACK)</button>
<button class="btn btn-amber"  id="b5-rq">↩ NACK + Requeue</button>
<button class="btn btn-danger" id="b5-dl">☠ NACK + Dead Letter</button>
<button class="btn btn-amber"  id="b5-to">⏱ Timeout</button>`;

  document.getElementById('b5-ok').onclick=doOK;
  document.getElementById('b5-rq').onclick=doNackRQ;
  document.getElementById('b5-dl').onclick=doNackDL;
  document.getElementById('b5-to').onclick=doTimeout;
}

/* ═══════════════════════════════════════════════════════════
   CHAPTER 7 — Dead Letter Queue
═══════════════════════════════════════════════════════════ */
function ch6(da, ca){
  document.getElementById('ch-brief').textContent =
    'A Dead Letter Queue (DLQ) catches messages that cannot be processed. Three things trigger dead-lettering: ' +
    '(1) NACK with requeue:false — consumer explicitly rejects the message; ' +
    '(2) message TTL expiry — the message sat in the queue longer than its time-to-live; ' +
    '(3) queue length limit exceeded — the queue is full and the oldest message is evicted. ' +
    'The message is re-published to a Dead Letter Exchange (DLX), which routes it to the DLQ for inspection.';

  document.getElementById('ch-note').innerHTML = `
<div style="border-left:3px solid var(--border);padding-left:12px;">
  <strong style="color:var(--text);font-size:13px;">What to do with DLQ messages</strong>
  <ul style="margin:6px 0 0;padding-left:16px;font-size:13px;">
    <li>Monitor the count — alert when it grows, it signals a systematic processing problem.</li>
    <li>Inspect the messages to identify the root cause (bad data, schema mismatch, missing dependency).</li>
    <li>Once fixed, replay by re-publishing from the DLQ back to the original exchange — or discard if no longer valid.</li>
  </ul>
</div>`;

  let busy=false, dlqN=0;
  da.innerHTML='';
  const svg = makeSVG(760,260); svg.setAttribute('height','260');

  // Main flow
  box(svg,10,102,90,44,'Producer',null,{stroke:'#4a7aaa',fill:'#1a2035'});
  box(svg,150,102,130,44,'Topic Exch.','type: topic',{stroke:'#7a5aaa',fill:'#20182a',tc:'#c0a8e8'});
  queue(svg,340,102,'"orders"');
  box(svg,520,102,110,44,'Consumer',null,{stroke:'#4aaa4a',fill:'#182018'});

  // DLX + DLQ row
  box(svg,340,188,130,44,'DLX','x-dead-letter-exch.',{stroke:'#f59e0b',fill:'#251b08',tc:'#f59e0b'});
  queue(svg,530,188,'"orders.dlq"',{stroke:'#ef4444'});

  // Arrows — main flow
  arrow(svg,100,124,148,124,{col:'muted'});
  arrow(svg,280,124,338,124,{col:'muted'});
  arrow(svg,456,124,518,124,{col:'muted'});

  // NACK → DLX  (dashed red, diagonal)
  arrow(svg,520,148,405,188,{col:'red',dash:true});
  // DLX → DLQ
  arrow(svg,470,210,528,210,{col:'amber',dash:true});

  txt(svg,465,183,'NACK',{col:'#ef4444',size:9,mono:true});
  txt(svg,498,207,'DLX routes →',{col:'#f59e0b',size:9,mono:true,anchor:'end'});

  // x-dlx badge on queue
  txt(svg,397,100,'x-dlx: "dlx"',{col:'#f59e0b',size:9,mono:true});

  const dlqBadge=svgEl('text',{x:648,y:184,'text-anchor':'middle',fill:'#ef4444','font-size':'10','font-family':'monospace',opacity:'0.5'});
  dlqBadge.textContent='0 dead'; svg.appendChild(dlqBadge);
  da.appendChild(svg);

  async function runFlow(){
    if(busy)return; busy=true;
    const btn=document.getElementById('b6-run'); if(!btn){ busy=false; return; }
    const restore6=animCtrl(btn);

    // 1 Producer → Exchange
    await new Promise(r=>dot(svg,[[100,124],[150,124]],{dur:400,onDone(d){rm(d);r();}}));
    // 2 Exchange → Queue
    await new Promise(r=>dot(svg,[[280,124],[340,124]],{dur:400,onDone(d){rm(d);r();}}));
    await wait(200);
    // 3 Queue → Consumer
    const d=await new Promise(r=>dot(svg,[[397,124],[520,124]],{dur:550,onArrive(d){r(d);}}));
    await wait(500);
    // 4 Consumer NACKs
    d.setAttribute('fill','#ef4444');
    await wait(350);
    rm(d);
    // 5 → DLX
    await new Promise(r=>dot(svg,[[520,148],[405,188]],{col:'#ef4444',dur:550,
      onArrive(d2){ flash(svg,405,188,'#ef4444'); setTimeout(()=>{ rm(d2); r(); },200); }}));
    // 6 DLX → DLQ
    await new Promise(r=>dot(svg,[[470,210],[530,210]],{col:'#f59e0b',dur:500,
      onArrive(d2){
        dlqN++;
        dlqBadge.textContent=`${dlqN} dead`;
        dlqBadge.setAttribute('opacity','1');
        flash(svg,587,210,'#ef4444');
        setTimeout(()=>{ rm(d2); r(); },200);
        const ba=document.getElementById('b6-badge');
        if(ba) ba.textContent=`DLQ: ${dlqN} message${dlqN!==1?'s':''}`;
      }}));

    busy=false; restore6();
  }

  ca.innerHTML=`
<button class="btn btn-primary" id="b6-run">▶ Run Full DLX Flow</button>
<span class="ctrl-label">Watch a message get rejected and land in the dead-letter queue</span>
<span class="badge badge-red" id="b6-badge" style="margin-left:auto">DLQ: 0 messages</span>`;
  document.getElementById('b6-run').onclick=runFlow;
}

/* ═══════════════════════════════════════════════════════════
   CHAPTER 8 — What's Next
═══════════════════════════════════════════════════════════ */
function chNext(da, ca){
  document.getElementById('ch-brief').textContent =
    "You've covered the complete RabbitMQ fundamentals. " +
    "The four topics below are the natural next step — each builds directly on what you've learned. " +
    "Click any card to see its code in the panel below.";

  da.innerHTML=''; ca.innerHTML='';

  const TOPICS = [
    {
      key:'8-confirms',
      title:'Publisher Confirms',
      color:'#00d4ff',
      body:'By default, BasicPublishAsync is fire-and-forget — if the broker crashes between receiving and writing the message to disk, it is lost with no indication to the producer. Publisher Confirms add a handshake: the broker ACKs or NACKs each message back to the producer, giving you guaranteed delivery on the publish side.',
      when:'Use when message loss on publish is unacceptable — payment events, order submissions, audit records.',
    },
    {
      key:'8-ttl',
      title:'Message & Queue TTL',
      color:'#f59e0b',
      body:'Time-to-live lets you set an expiry on messages or entire queues. A message that outlives its TTL is dead-lettered (if a DLX is configured) or silently dropped. You can set TTL per-message via BasicProperties.Expiration, or per-queue via the x-message-ttl argument so it applies to everything in that queue.',
      when:'Use for time-sensitive events (price ticks, session tokens, OTPs) that are worthless after a fixed window.',
    },
    {
      key:'8-limits',
      title:'Queue Length Limits',
      color:'#a78bfa',
      body:'Unbounded queues can exhaust broker memory when consumers fall behind. x-max-length caps the message count; x-max-length-bytes caps total size. When the limit is hit, the overflow behaviour kicks in: drop-head silently evicts the oldest message (pair with a DLX to catch evicted messages), or reject-publish refuses new publishes and returns them to the producer.',
      when:'Use whenever a slow consumer or traffic spike could grow the queue without bound.',
    },
    {
      key:'8-streams',
      title:'Streams',
      color:'#22c55e',
      body:'Classic queues delete messages on ACK — only one consumer can read each message. Streams are a persistent, append-only log: messages are never deleted on ACK, and every consumer reads independently at its own offset. You can replay from "first", seek to a timestamp, or start from "next" (live tail). Added in RabbitMQ 3.9.',
      when:'Use for event sourcing, audit logs, or when multiple independent consumers need the same messages without fanout overhead.',
    },
  ];

  const grid = document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:14px;';

  let activeTopic = null;

  TOPICS.forEach(t=>{
    const card = document.createElement('div');
    card.style.cssText=`border:1px solid var(--border);border-top:3px solid ${t.color};border-radius:8px;padding:14px 16px;background:var(--surface);cursor:pointer;transition:border-color 0.15s;`;
    card.innerHTML=`
      <div style="font-size:13px;font-weight:700;color:${t.color};margin-bottom:6px;">${t.title}</div>
      <p style="font-size:12.5px;line-height:1.6;color:var(--text-muted);margin:0 0 8px;">${t.body}</p>
      <div style="font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:7px;">
        <span style="color:${t.color};font-weight:600;">Use when:</span> ${t.when}
      </div>`;
    card.onmouseenter=()=>{ if(activeTopic!==t.key) card.style.borderColor=t.color; };
    card.onmouseleave=()=>{ if(activeTopic!==t.key) card.style.cssText=`border:1px solid var(--border);border-top:3px solid ${t.color};border-radius:8px;padding:14px 16px;background:var(--surface);cursor:pointer;transition:border-color 0.15s;`; };
    card.onclick=()=>{
      activeTopic=t.key;
      grid.querySelectorAll('div[data-topic]').forEach(c=>{ c.style.boxShadow='none'; });
      card.style.boxShadow=`0 0 0 2px ${t.color}`;
      renderCodeDirect(CODE[t.key]||'', []);
    };
    card.setAttribute('data-topic', t.key);
    grid.appendChild(card);
  });

  da.appendChild(grid);

  // Link to official docs below cards
  const docsRow = document.createElement('div');
  docsRow.style.cssText='margin-top:16px;display:flex;align-items:center;gap:12px;';
  docsRow.innerHTML=`
    <span style="font-size:13px;color:var(--text-muted);">Ready to go deeper?</span>
    <a href="https://www.rabbitmq.com/docs" target="_blank" rel="noopener"
       style="display:inline-block;padding:7px 14px;border-radius:6px;border:1px solid var(--cyan);color:var(--cyan);font-size:12px;font-weight:600;text-decoration:none;">
      Official RabbitMQ Docs →
    </a>`;
  da.appendChild(docsRow);
}

const RENDERS = [ch0,chBroker,ch1,ch2,ch3,ch4,ch5,ch6,chNext];
let cur = 0;

function go(id){
  cur = id;
  document.getElementById('ch-label').textContent = CHAPTERS[id].label==='Intro'?'Introduction':CHAPTERS[id].label;
  document.getElementById('ch-title').textContent = CHAPTERS[id].title;
  document.getElementById('ch-sub').textContent   = CHAPTERS[id].sub;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',+n.dataset.id===id));
  const da=document.getElementById('diagram-area');
  const ca=document.getElementById('controls');
  da.innerHTML=''; ca.innerHTML='';
  document.getElementById('ch-brief').textContent='';
  document.getElementById('ch-note').textContent='';
  const oldTab=document.getElementById('code-tab-bar'); if(oldTab) oldTab.remove();
  RENDERS[id](da,ca);
  renderCode(id);
  document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
}

// Build sidebar nav
const nav=document.getElementById('sb-nav');
CHAPTERS.forEach(ch=>{
  const li=document.createElement('li');
  const div=document.createElement('div');
  div.className='nav-item'+(ch.id===0?' active':'');
  div.dataset.id=ch.id;
  div.setAttribute('role','button');
  div.setAttribute('tabindex','0');
  div.setAttribute('aria-label',`${ch.label}: ${ch.title}`);
  div.innerHTML=`<span class="nav-num">${ch.id}</span><span>${ch.title}</span>`;
  div.onclick=()=>go(ch.id);
  div.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(ch.id); } };
  li.appendChild(div); nav.appendChild(li);
});

// Build glossary
const glist=document.getElementById('g-list');
GLOSSARY.forEach(g=>{
  const d=document.createElement('div'); d.className='g-item';
  d.innerHTML=`<div class="g-term">${g.term}</div><div class="g-def">${g.def}</div>`;
  glist.appendChild(d);
});

// Glossary open/close
const gov=document.getElementById('g-overlay');
const gpan=document.getElementById('g-panel');
function openG(){ gpan.removeAttribute('hidden'); setTimeout(()=>{ gov.classList.add('open'); gpan.classList.add('open'); },10); }
function closeG(){ gov.classList.remove('open'); gpan.classList.remove('open'); setTimeout(()=>gpan.setAttribute('hidden',''),300); }
document.getElementById('glos-open').onclick=openG;
document.getElementById('glos-close').onclick=closeG;
gov.onclick=closeG;

// Keyboard
document.addEventListener('keydown',e=>{
  if(gpan.classList.contains('open')){ if(e.key==='Escape') closeG(); return; }
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') go(Math.min(cur+1,6));
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp')   go(Math.max(cur-1,0));
});

// Init
go(0);
document.getElementById('footer-year').textContent = new Date().getFullYear();

// Mobile sidebar toggle
(function(){
  const ham = document.getElementById('mob-ham');
  const overlay = document.getElementById('sb-overlay');
  const sidebar = document.getElementById('sidebar');
  function open()  { sidebar.classList.add('open'); overlay.classList.add('open'); ham.setAttribute('aria-expanded','true'); }
  function close() { sidebar.classList.remove('open'); overlay.classList.remove('open'); ham.setAttribute('aria-expanded','false'); }
  ham.addEventListener('click', () => sidebar.classList.contains('open') ? close() : open());
  overlay.addEventListener('click', close);
  document.getElementById('sb-nav').addEventListener('click', () => { if (window.innerWidth < 768) close(); });
})();
</script>
